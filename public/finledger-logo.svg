<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="100%" height="100%">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0b3c2d" />
      <stop offset="50%" stop-color="#1b5e4b" />
      <stop offset="100%" stop-color="#2d8a6e" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)">
    <!-- Hexagonal Outer Frame / Stylized F -->
    <path d="M 50 10 L 85 30 L 85 70 L 50 90 L 15 70 L 15 30 Z" fill="none" stroke="url(#emeraldGrad)" stroke-width="8" stroke-linejoin="round" />
    
    <!-- Ledger Grid Lines -->
    <path d="M 30 45 L 70 45 M 30 58 L 70 58 M 30 71 L 70 71 M 42 35 L 42 78 M 58 35 L 58 78" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" />

    <!-- Upward Trend Arrow (F-Shape) -->
    <path d="M 22 72 L 40 50 L 52 60 L 78 28" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
    <polygon points="78,22 84,34 70,32" fill="#f59e0b" />

    <!-- Core Geometric F Highlight -->
    <path d="M 25 28 L 65 28 M 25 28 L 25 72 M 25 48 L 55 48" fill="none" stroke="url(#emeraldGrad)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- TEXT TYPOGRAPHY -->
  <!-- "Fin" -->
  <text x="115" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#0f172a" letter-spacing="-1">Fin</text>
  <!-- "Ledger" -->
  <text x="180" y="66" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#1b5e4b" letter-spacing="-1">Ledger</text>
  
  <!-- Subtitle: FINANCIAL MANAGEMENT -->
  <text x="117" y="90" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="3.5">FINANCIAL MANAGEMENT</text>
</svg>
